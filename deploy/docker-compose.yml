# Local development database. The Kollaudo container is added in v0.1.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kollaudo
      POSTGRES_PASSWORD: kollaudo
      POSTGRES_DB: kollaudo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kollaudo"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
